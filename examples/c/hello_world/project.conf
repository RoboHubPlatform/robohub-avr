# The application's configuration.
#
# The symbols a program may set are declared by the modules it depends on; this
# file says which of them this application sets. A build merges the fragments of
# every module in the graph with this file on top, and the result is the
# configuration header the sources are compiled against.
#
# So what is in the firmware is what is written here. A driver that is not asked
# for is not compiled: it stays in the platform, and it is out of the binary.

# The two peripherals this program needs, and no others.
CONFIG_RH_HAL_UART=y
CONFIG_RH_HAL_GPIO=y
# The program asks the timebase for a delay, so it needs the interface and the
# driver behind it.
CONFIG_RH_HAL_TIMER=y

# The rest of the platform's interfaces, so that a build of this project proves
# the whole platform compiles and links for this part and not only the two
# drivers this program calls.
CONFIG_RH_HAL_I2C=y
CONFIG_RH_HAL_SPI=y
CONFIG_RH_HAL_ONEWIRE=y
CONFIG_RH_HAL_DHT=y
CONFIG_RH_HAL_ADC=y
CONFIG_RH_HAL_PWM=y

# The platform's own: checking a driver's arguments rather than writing to a
# peripheral that was not configured.
CONFIG_ROBOHUB_AVR=y
CONFIG_ROBOHUB_AVR_ASSERT=y

# The board is not named here: it is the preset the build was given, and the
# preset is what says which board's support package is compiled in.

# This program's own.
CONFIG_HELLO_WORLD_BLINK_MS=1000
