# CI for this repository: the RoboHub workflow every repository in the
# ecosystem calls, so the steps are written once (robohub/.github/workflows).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: RoboHubPlatform/robohub/.github/workflows/robohub-ci.yml@main
    secrets: inherit
    with:
      siblings: robohub-common
      components: rho-cimport rho-target rho-kconfig rho-robohub
      targets: uno-r3
      build: examples/*/hello_world
      machine: true
